      - name: Build Kernel
        run: |
          export PATH="$PWD/clang/bin:$PWD/gcc64/bin:$PWD/gcc32/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          EXTRA_CFG=$(find arch/arm64/configs -name "gta4l.config" | sed 's|arch/arm64/configs/||')
          make O=out ARCH=arm64 vendor/bengal-perf_defconfig vendor/gta4l-common.config $EXTRA_CFG
          sed -i 's/=m$/=y/g' out/.config
          ./scripts/config --file out/.config \
            -e CONFIG_KSU \
            -e CONFIG_KSU_MANUAL_SU \
            -d CONFIG_KSU_SUSFS \
            -d CONFIG_KPROBES \
            -d CONFIG_KPROBE_EVENTS \
            -d CONFIG_BUILD_ARM64_DT_OVERLAY \
            -d CONFIG_MODULES \
            -d CONFIG_LOCALVERSION_AUTO \
            --set-str CONFIG_LOCALVERSION "-cip136-st20-perf-gcbd2ed85b026"
          make O=out ARCH=arm64 olddefconfig
          make -j$(nproc) O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- KCFLAGS="-Wno-macro-redefined -Wno-unused-variable" Image.gz

      - name: Package AnyKernel3
        run: |
          GH="https://github.com"
          git clone --depth=1 $GH/osm0sis/AnyKernel3.git
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
          sed -i 's|BLOCK=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot|BLOCK=/dev/block/bootdevice/by-name/boot|g' AnyKernel3/anykernel.sh
          cp out/arch/arm64/boot/Image.gz AnyKernel3/
          cd AnyKernel3 && zip -r9 ../SukiSU-Nova-T505.zip * -x .git README.md *placeholder
