name: Build SukiSU-Nova + SUSFS (SM-T505)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: kernel

      - name: Checkout AnyKernel3
        uses: actions/checkout@v4
        with:
          repository: osm0sis/AnyKernel3
          path: AnyKernel3

      - name: Install Dependencies & Toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex libncurses-dev libssl-dev libelf-dev python3 zip unzip wget git clang lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Integrate SukiSU-Nova (builtin branch)
        working-directory: kernel
        run: |
          H="https"
          D="git.zako.shirkneko.top:20004"
          R="shirkneko/SukiSU/raw/branch/main/kernel/setup.sh"
          curl -LSs "${H}://${D}/${R}" | bash -s builtin

      - name: Configure Defconfig + SUSFS for SM-T505
        working-directory: kernel
        run: |
          DEFCONFIG=$(find arch/arm64/configs -name "*gta4l*defconfig" | head -n 1 | sed 's|arch/arm64/configs/||')
          echo "Using defconfig: $DEFCONFIG"
          echo "DEFCONFIG_NAME=$DEFCONFIG" >> $GITHUB_ENV
          cat << 'EOF' >> arch/arm64/configs/$DEFCONFIG
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_SU=y
          CONFIG_KSU_HACK_ARM64_BRANCH_LINK=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KPM=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          EOF

      - name: Build Kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- $DEFCONFIG_NAME
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- KCFLAGS="-Wno-error" Image.gz-dtb dtbo.img

      - name: Package AnyKernel3
        run: |
          cd AnyKernel3
          sed -i 's/device.name1=.*/device.name1=gta4l/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=SM-T505/' anykernel.sh
          sed -i 's|BLOCK=.*|BLOCK=/dev/block/bootdevice/by-name/boot;|' anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=0;/' anykernel.sh
          cp ../kernel/out/arch/arm64/boot/Image.gz-dtb .
          zip -r9 ../SukiSU-Nova-SUSFS-SM-T505-LOS24.zip * -x .git README.md *placeholder

      - name: Upload Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Nova-SUSFS-SM-T505-LOS24
          path: SukiSU-Nova-SUSFS-SM-T505-LOS24.zip
